<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Vitava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap&font-display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --color-bg:#f4f6fa; --color-surface:#ffffff; --color-surface-2:#f0f2f7;
  --color-ink:#0c1a3d; --color-ink-2:#1e2d56; --color-ink-3:#5a6a8a; --color-ink-4:#767068;
  --color-border:#dde2ee; --color-border-2:#c8d0e4;
  --color-brand:#0c1a3d; --color-brand-dark:#070f24;
  --color-brand-bg:#eef1f8; --color-brand-bd:#b0bcda;
  --color-gold:#c9980a; --color-gold-2:#e6b20e;
  --color-gold-bg:#fdf8e8; --color-gold-bd:#f0d070;
  --color-green:#059669; --color-green-2:#10b981;
  --color-green-bg:#ecfdf5; --color-green-bd:#a7f3d0;
  --color-amber:#b45309; --color-amber-bg:#fffbeb; --color-amber-bd:#fde68a;
  --color-red:#b91c1c; --color-red-bg:#fef2f2; --color-red-bd:#fecaca;
  /* Legacy aliases — keeps all existing code working */
  --ink:var(--color-ink); --ink-2:var(--color-ink-2);
  --ink-3:var(--color-ink-3); --ink-4:var(--color-ink-4);
  --border:var(--color-border); --border-2:var(--color-border-2);
  --surface:var(--color-surface); --bg:var(--color-bg);
  --brand:var(--color-brand); --brand-dark:var(--color-brand-dark);
  --brand-bg:var(--color-brand-bg); --brand-bd:var(--color-brand-bd);
  --green:var(--color-green); --green-bg:var(--color-green-bg); --green-bd:var(--color-green-bd);
  --amber:var(--color-amber); --amber-bg:var(--color-amber-bg); --amber-bd:var(--color-amber-bd);
  --red:var(--color-red); --red-bg:var(--color-red-bg); --red-bd:var(--color-red-bd);
  --radius-sm:10px; --radius:12px; --radius-lg:20px; --radius-xl:24px;
  --shadow-sm:0 1px 3px rgba(12,26,61,.07),0 1px 2px rgba(12,26,61,.05);
  --shadow:0 4px 20px rgba(12,26,61,.10),0 2px 8px rgba(12,26,61,.06);
  --shadow-lg:0 20px 48px rgba(12,26,61,.16);
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-6:48px; --sp-8:64px;
}
html,body{font-family:'Space Grotesk',-apple-system,sans-serif;background:linear-gradient(150deg,#0c1a3d 0%,#0f2255 55%,#091530 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{background:#fff;border-radius:24px;box-shadow:0 24px 64px rgba(12,26,61,.35);width:100%;max-width:420px;overflow:hidden;border-top:3px solid var(--color-gold)}
.logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:24px;text-decoration:none}
.logo-icon{width:40px;height:40px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.logo-text{font-size:18px;font-weight:700;color:var(--ink)}
.logo-text em{color:var(--brand);font-style:normal}
h2{font-size:20px;font-weight:700;margin-bottom:6px}
.sub{font-size:13px;color:var(--ink-3);margin-bottom:24px}
.form-group{margin-bottom:16px;text-align:left}
label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:6px}
input[type=password]{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;color:var(--ink);outline:none;transition:border-color .15s}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(185,28,28,.1)}
.btn{width:100%;padding:15px;background:var(--color-brand);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .2s;box-shadow:0 4px 16px rgba(12,26,61,.3)}
.btn:hover{background:var(--color-brand-dark);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.error-msg{background:var(--brand-bg);border:1px solid var(--brand-bd);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--brand);margin-bottom:16px;display:none;text-align:left}
.error-msg.show{display:block}
.success-msg{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:var(--radius);padding:10px 14px;font-size:13px;color:#065f46;margin-bottom:16px;display:none}
.success-msg.show{display:block}
.back-link{display:inline-block;margin-top:16px;font-size:13px;color:var(--ink-3);text-decoration:none}
.back-link:hover{color:var(--brand)}
.pw-wrap{position:relative}
.pw-wrap input{background:#fff;border:2px solid var(--color-border-2);color:var(--color-ink);border-radius:10px;padding:12px 48px 12px 16px;font-family:inherit;font-size:16px;width:100%;transition:border-color .15s,outline .15s;min-height:44px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;border-radius:6px;transition:color .15s}
.pw-eye:hover{color:var(--ink)}
.pw-eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2L8 9H3l4.5 5.5L5 22l7-4.5L19 22l-2.5-7.5L21 9h-5L12 2z"/></svg></div>
    <span class="logo-text">Vita<em>va</em></span>
  </a>
  <h2 id="title">Set a new password</h2>
  <p class="sub" id="sub">Choose a strong password of at least 8 characters.</p>
  <div class="error-msg" id="err"></div>
  <div class="success-msg" id="ok"></div>
  <div id="form-area">
    <div class="form-group">
      <label for="pw">New Password</label>
      <div class="pw-wrap"><input type="password" id="pw" placeholder="Min. 8 characters" autocomplete="new-password" onkeydown="if(event.key==='Enter')doReset()"><button type="button" class="pw-eye" onclick="togglePw('pw', this)" aria-label="Show password" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    </div>
    <div class="form-group">
      <label for="pw2">Confirm Password</label>
      <div class="pw-wrap"><input type="password" id="pw2" placeholder="Repeat password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doReset()"><button type="button" class="pw-eye" onclick="togglePw('pw2', this)" aria-label="Show password" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    </div>
    <button class="btn" id="btn" onclick="doReset()">Reset Password</button>
  </div>
  <a href="/login" class="back-link">← Back to sign in</a>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('title').textContent = 'Invalid link';
  document.getElementById('sub').textContent = 'This reset link is missing or invalid. Please request a new one.';
  document.getElementById('form-area').style.display = 'none';
}

async function doReset() {
  document.getElementById('err').classList.remove('show');
  document.getElementById('ok').classList.remove('show');
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  if (pw.length < 8) return showErr('Password must be at least 8 characters.');
  if (pw !== pw2) return showErr('Passwords do not match.');
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Resetting…';
  try {
    const resp = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw }),
    });
    const data = await resp.json();
    if (!resp.ok) return showErr(data.error || 'Reset failed.');
    document.getElementById('form-area').style.display = 'none';
    const ok = document.getElementById('ok');
    ok.textContent = 'Password reset successfully! Redirecting to sign in…';
    ok.classList.add('show');
    setTimeout(() => window.location.href = '/login', 2000);
  } catch(e) {
    showErr('Network error. Please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Reset Password';
  }
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg; el.classList.add('show');
}

function togglePw(inputId, btn) {
  var inp = document.getElementById(inputId);
  var show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  btn.innerHTML = show
    ? '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  inp.focus();
}
</script>
</body>
</html>
